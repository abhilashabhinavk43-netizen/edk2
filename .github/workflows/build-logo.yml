name: Build Custom LogoDxe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Essentials & ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools imagemagick

      - name: Fix and Format Logo.bmp for EDK2 Specs
        run: |
          # 1. Resizes to 360x270 so the full drawing fits easily without stretching
          # 2. -page -80+0 shifts the placement 80px left to perfectly reconnect the hand and arm
          convert MdeModulePkg/Logo/Logo.bmp +page -fuzz 10% -trim +repage -resize 360x270 -background black -gravity center -page -80+0 -flatten -extent 640x480 -type TrueColor -define bmp:format=bmp3 MdeModulePkg/Logo/Logo.bmp
          
      - name: Compile BaseTools C Modules
        run: |
          make -C BaseTools/Source/C

      - name: Build LogoDxe
        run: |
          export PYTHON_COMMAND=python3
          . edksetup.sh
          build -p MdeModulePkg/MdeModulePkg.dsc -m MdeModulePkg/Logo/LogoDxe.inf -a X64 -t GCC

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogoDxe-Custom
          path: |
            Build/MdeModulePkg/**/LogoDxe.efi
            **/LogoDxe.efi
            
