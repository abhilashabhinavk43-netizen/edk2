name: Build Custom LogoDxe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools

      - name: Compile BaseTools C Modules
        run: |
          make -C BaseTools/Source/C

      - name: Build LogoDxe
        run: |
          export PYTHON_COMMAND=python3
          . edksetup.sh
          build -p MdeModulePkg/MdeModulePkg.dsc -m MdeModulePkg/Logo/LogoDxe.inf -a X64 -t GCC5

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogoDxe-Custom
          path: Build/MdeModulePkg/*/DEBUG_GCC5/X64/LogoDxe.efi
